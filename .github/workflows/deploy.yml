name: Deploy to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy application via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            echo "🚀 Starting deployment on EC2..."

            APP_DIR="${{ secrets.EC2_APP_DIR || '/home/ubuntu/central-evaluator' }}"

            # If directory doesn't exist, clone the repo
            if [ ! -d "$APP_DIR/.git" ]; then
              echo "📁 Repository not found at $APP_DIR. Cloning..."
              git clone https://github.com/${{ github.repository }}.git "$APP_DIR"
            fi

            cd "$APP_DIR"

            # Pull latest changes
            echo "📥 Pulling latest changes from branch main..."
            git fetch --all
            git checkout main
            git reset --hard origin/main

            # Inject / update .env file if provided in GitHub Secrets
            if [ -n "${{ secrets.ENV_FILE }}" ]; then
              echo "🔑 Writing production .env configuration..."
              echo "${{ secrets.ENV_FILE }}" > .env
            fi

            # Install dependencies
            echo "📦 Installing production dependencies..."
            npm ci --omit=dev || npm install --omit=dev

            # Ensure Playwright dependencies & browser are installed for visual evaluator
            echo "🎭 Installing Playwright Chromium dependencies..."
            npx playwright install --with-deps chromium || true

            # Pre-pull Docker sandbox images for sub-second evaluations
            if command -v docker &> /dev/null; then
              echo "🐳 Pre-pulling Docker sandbox runner images..."
              docker pull node:18-alpine || true
              docker pull python:3.11-alpine || true
            fi

            # Ensure PM2 is installed globally
            if ! command -v pm2 &> /dev/null; then
              echo "⚙️ Installing PM2 process manager..."
              sudo npm install -g pm2
            fi

            # Reload or start server using PM2
            echo "🔄 Starting / Reloading application with PM2..."
            if pm2 list | grep -q "central-evaluator"; then
              pm2 reload central-evaluator --update-env
            else
              pm2 start server.js --name "central-evaluator" --time
            fi

            pm2 save

            echo "✅ Deployment completed successfully!"
            pm2 status central-evaluator
