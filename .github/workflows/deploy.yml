name: Deploy to AWS EC2

on:
  push:
    branches:
      - main
      - feat/excel-evaluator-engine
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy application via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            echo "🚀 Starting deployment on EC2..."

            APP_DIR="${{ secrets.EC2_APP_DIR || '/home/ubuntu/central-evaluator' }}"

            # If directory doesn't exist, clone the repo
            if [ ! -d "$APP_DIR/.git" ]; then
              echo "📁 Repository not found at $APP_DIR. Cloning..."
              git clone https://github.com/${{ github.repository }}.git "$APP_DIR"
            fi

            cd "$APP_DIR"

            # Pull latest changes from selected branch
            DEPLOY_BRANCH="${{ github.ref_name }}"
            echo "📥 Pulling latest changes from branch $DEPLOY_BRANCH..."
            git fetch --all
            git checkout "$DEPLOY_BRANCH"
            git reset --hard "origin/$DEPLOY_BRANCH"

            # Inject / update .env file if provided in GitHub Secrets
            if [ -n "${{ secrets.ENV_FILE }}" ]; then
              echo "🔑 Writing production .env configuration..."
              echo "${{ secrets.ENV_FILE }}" > .env
            fi

            # Install Node dependencies
            echo "📦 Installing production dependencies..."
            npm ci --omit=dev || npm install --omit=dev

            # Install Python dependencies for Excel dual-workbook evaluation
            echo "🐍 Installing Python dependencies (openpyxl, pandas)..."
            sudo apt-get update -y && sudo apt-get install -y python3-openpyxl python3-pandas || true
            if command -v pip3 &> /dev/null; then
              pip3 install -r requirements.txt --break-system-packages || pip3 install -r requirements.txt || true
            elif command -v pip &> /dev/null; then
              pip install -r requirements.txt || true
            fi

            # Ensure Playwright dependencies & browser are installed for visual evaluator
            echo "🎭 Installing Playwright Chromium dependencies..."
            npx playwright install --with-deps chromium || true

            # Pre-pull Docker sandbox images and build Excel sandbox container
            if command -v docker &> /dev/null; then
              echo "🐳 Pre-pulling Docker sandbox runner images..."
              docker pull node:20-slim || true
              docker pull python:3.11-alpine || true
              echo "📊 Building Excel isolated sandbox container..."
              docker build -f docker/Dockerfile.excel -t eval-excel-sandbox . || true
            fi

            # Ensure PM2 is installed globally
            if ! command -v pm2 &> /dev/null; then
              echo "⚙️ Installing PM2 process manager..."
              sudo npm install -g pm2
            fi

            # Fix ownership of PM2 and app directories in case created by root
            sudo chown -R $(whoami):$(whoami) /home/$(whoami)/.pm2 "$APP_DIR" || true
            mkdir -p "$APP_DIR/logs"

            # Reload or start server using PM2
            echo "🔄 Starting / Reloading application with PM2..."
            if pm2 describe central-evaluator > /dev/null 2>&1; then
              pm2 reload ecosystem.config.cjs --env production || pm2 reload central-evaluator --update-env
            else
              pm2 start ecosystem.config.cjs --env production || pm2 start server.js --name "central-evaluator" --time
            fi

            pm2 save || true

            echo "✅ Deployment completed successfully!"
            pm2 status
